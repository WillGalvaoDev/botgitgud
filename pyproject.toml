[project]
name = "botgitgud"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = ["duckdb>=1.0", "pyarrow>=16", "polars>=1.0"]
ml = ["lightgbm>=4.3", "shap>=0.45", "scikit-learn>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "syrupy>=4", "ruff>=0.5", "pyright>=1.1", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botgitgud"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy"]
extraPaths = ["tests/fixtures"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
# Sem isto o pyright cai no interpretador do PATH, que não tem as dependências
# nem o install editável — `pyright src tests` acusava 416 erros de import.
# Caminhos relativos ao pyproject.toml; o pyright escolhe Scripts/ ou bin/
# conforme a plataforma, então isto continua portável.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: requer acesso real à API (desabilitado por padrão)"]
